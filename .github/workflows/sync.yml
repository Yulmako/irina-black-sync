name: Sync zapis.kz bookings into Supabase

on:
  schedule:
    # Два запуска в час в нечётные минуты — GitHub реже пропускает их,
    # чем запуск ровно в начале часа.
    - cron: '7 * * * *'
    - cron: '37 * * * *'
  workflow_dispatch: {} # ручной запуск из вкладки Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync bookings into Supabase
        env:
          ZAPIS_COOKIE: ${{ secrets.ZAPIS_COOKIE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/sync.js
